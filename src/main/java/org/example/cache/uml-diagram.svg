<svg viewBox="0 0 960 930" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Full UML class diagram of the cache with all fields and method signatures: Cache depends on the Storage and EvictionPolicy interfaces; MapStorage implements Storage; LruEvictionPolicy implements EvictionPolicy and owns a DoublyLinkedList of Node, plus its own key-to-node map noted separately from Storage's map.">
  <defs>
    <marker id="arrowOpen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#55635F" stroke-width="1.4"/>
    </marker>
    <marker id="triHollow" viewBox="0 0 14 12" refX="12.5" refY="6" markerWidth="15" markerHeight="13" orient="auto-start-reverse">
      <path d="M1,1 L13,6 L1,11 Z" fill="#FFFFFF" stroke="#55635F" stroke-width="1.3"/>
    </marker>
    <marker id="diamondFilled" viewBox="0 0 14 9" refX="1" refY="4.5" markerWidth="14" markerHeight="9" orient="auto">
      <polygon points="1,4.5 7,1 13,4.5 7,8" fill="#55635F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="930" fill="#FFFFFF"/>

  <!-- ================= Cache<K,V> ================= -->
  <g>
    <rect x="315" y="16" width="340" height="140" rx="6" fill="#FFFFFF" stroke="#172227" stroke-width="1.4"/>
    <text x="485" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="600" font-size="13.5" fill="#172227">Cache&lt;K,V&gt;</text>
    <line x1="315" y1="54" x2="655" y2="54" stroke="#C7CEC8"/>
    <text x="330" y="70" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">- storage: Storage&lt;K,V&gt;</text>
    <text x="330" y="84" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">- evictionPolicy: EvictionPolicy&lt;K&gt;</text>
    <text x="330" y="98" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">- maxCapacity: int</text>
    <line x1="315" y1="110" x2="655" y2="110" stroke="#C7CEC8"/>
    <text x="330" y="126" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#172227">+ put(key: K, value: V): void</text>
    <text x="330" y="140" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#172227">+ get(key: K): V</text>

    <circle cx="610" cy="10" r="10" fill="#F5E4CF" stroke="#B8722A"/>
    <text x="610" y="14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="600" fill="#6B4319">1</text>
    <circle cx="628" cy="10" r="10" fill="#F5E4CF" stroke="#B8722A"/>
    <text x="628" y="14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="600" fill="#6B4319">3</text>
    <circle cx="646" cy="10" r="10" fill="#F5E4CF" stroke="#B8722A"/>
    <text x="646" y="14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="600" fill="#6B4319">7</text>
  </g>

  <!-- Cache -> Storage / EvictionPolicy (dependency) -->
  <line x1="415" y1="156" x2="210" y2="210" stroke="#55635F" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowOpen)"/>
  <text x="290" y="187" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">uses</text>

  <line x1="535" y1="156" x2="760" y2="210" stroke="#55635F" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowOpen)"/>
  <text x="640" y="187" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">uses</text>

  <!-- ============ Storage<K,V> interface ============ -->
  <g>
    <rect x="60" y="210" width="300" height="150" rx="6" fill="#FFFFFF" stroke="#1F6F78" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="210" y="232" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-style="italic" font-size="10.5" fill="#1F6F78">&#171;interface&#187;</text>
    <text x="210" y="250" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="600" font-size="13" fill="#172227">Storage&lt;K,V&gt;</text>
    <line x1="60" y1="260" x2="360" y2="260" stroke="#C7CEC8"/>
    <text x="75" y="276" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ add(key: K, value: V): void</text>
    <text x="75" y="290" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ get(key: K): V</text>
    <text x="75" y="304" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ remove(key: K): void</text>
    <text x="75" y="318" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ contains(key: K): boolean</text>
    <text x="75" y="332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ size(): int</text>
  </g>

  <!-- ============ EvictionPolicy<K> interface ============ -->
  <g>
    <rect x="580" y="210" width="360" height="120" rx="6" fill="#FFFFFF" stroke="#1F6F78" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="760" y="232" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-style="italic" font-size="10.5" fill="#1F6F78">&#171;interface&#187;</text>
    <text x="760" y="250" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="600" font-size="13" fill="#172227">EvictionPolicy&lt;K&gt;</text>
    <line x1="580" y1="260" x2="940" y2="260" stroke="#C7CEC8"/>
    <text x="595" y="276" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ addNewNode(key: K): void</text>
    <text x="595" y="290" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ markAccessed(key: K): void</text>
    <text x="595" y="304" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ evict(): K</text>

    <circle cx="934" cy="204" r="10" fill="#F5E4CF" stroke="#B8722A"/>
    <text x="934" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="600" fill="#6B4319">6</text>
  </g>

  <!-- realization: MapStorage -> Storage -->
  <line x1="210" y1="390" x2="210" y2="362" stroke="#55635F" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#triHollow)"/>
  <!-- realization: LruEvictionPolicy -> EvictionPolicy -->
  <line x1="760" y1="360" x2="760" y2="332" stroke="#55635F" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#triHollow)"/>

  <!-- ============ MapStorage<K,V> ============ -->
  <g>
    <rect x="60" y="390" width="300" height="160" rx="6" fill="#FFFFFF" stroke="#172227" stroke-width="1.4"/>
    <text x="210" y="414" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="600" font-size="13" fill="#172227">MapStorage&lt;K,V&gt;</text>
    <line x1="60" y1="424" x2="360" y2="424" stroke="#C7CEC8"/>
    <text x="75" y="440" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">- storageMap: Map&lt;K,V&gt;</text>
    <line x1="60" y1="452" x2="360" y2="452" stroke="#C7CEC8"/>
    <text x="75" y="468" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ add(key: K, value: V): void</text>
    <text x="75" y="482" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ get(key: K): V</text>
    <text x="75" y="496" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ remove(key: K): void</text>
    <text x="75" y="510" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ contains(key: K): boolean</text>
    <text x="75" y="524" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ size(): int</text>

    <circle cx="354" cy="384" r="10" fill="#F5E4CF" stroke="#B8722A"/>
    <text x="354" y="388" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="600" fill="#6B4319">5</text>
  </g>

  <!-- ============ LruEvictionPolicy<K> ============ -->
  <g>
    <rect x="580" y="360" width="360" height="150" rx="6" fill="#FFFFFF" stroke="#172227" stroke-width="1.6"/>
    <text x="760" y="384" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="600" font-size="13" fill="#172227">LruEvictionPolicy&lt;K&gt;</text>
    <line x1="580" y1="394" x2="940" y2="394" stroke="#C7CEC8"/>
    <text x="595" y="410" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">- nodeMap: Map&lt;K, Node&lt;K&gt;&gt;</text>
    <text x="595" y="424" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">- list: DoublyLinkedList&lt;K&gt;</text>
    <line x1="580" y1="436" x2="940" y2="436" stroke="#C7CEC8"/>
    <text x="595" y="452" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ evict(): K</text>
    <text x="595" y="466" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ addNewNode(key: K): void</text>
    <text x="595" y="480" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ markAccessed(key: K): void</text>

    <circle cx="934" cy="354" r="11" fill="#F5E4CF" stroke="#B8722A" stroke-width="1.4"/>
    <text x="934" y="358" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" fill="#6B4319">2</text>
  </g>

  <!-- composition: LruEvictionPolicy -> DoublyLinkedList -->
  <line x1="760" y1="510" x2="760" y2="560" stroke="#55635F" stroke-width="1.4" marker-start="url(#diamondFilled)"/>
  <text x="768" y="538" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#55635F">list</text>

  <!-- ============ DoublyLinkedList<K> ============ -->
  <g>
    <rect x="580" y="560" width="360" height="150" rx="6" fill="#FFFFFF" stroke="#172227" stroke-width="1.4"/>
    <text x="760" y="584" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="600" font-size="13" fill="#172227">DoublyLinkedList&lt;K&gt;</text>
    <line x1="580" y1="594" x2="940" y2="594" stroke="#C7CEC8"/>
    <text x="595" y="610" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">- head: Node&lt;K&gt;</text>
    <text x="595" y="624" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">- tail: Node&lt;K&gt;</text>
    <line x1="580" y1="636" x2="940" y2="636" stroke="#C7CEC8"/>
    <text x="595" y="652" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ add(node: Node&lt;K&gt;): void</text>
    <text x="595" y="666" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ evict(): K</text>
    <text x="595" y="680" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ moveToMostRecentlyUsed(node: Node&lt;K&gt;): void</text>

    <circle cx="934" cy="554" r="10" fill="#F5E4CF" stroke="#B8722A"/>
    <text x="934" y="558" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="600" fill="#6B4319">4</text>
  </g>

  <!-- composition: DoublyLinkedList -> Node -->
  <line x1="760" y1="710" x2="760" y2="760" stroke="#55635F" stroke-width="1.4" marker-start="url(#diamondFilled)"/>
  <text x="768" y="738" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#55635F">next/prev</text>

  <!-- ============ Node<K> ============ -->
  <g>
    <rect x="580" y="760" width="360" height="140" rx="6" fill="#FFFFFF" stroke="#172227" stroke-width="1.4"/>
    <text x="760" y="784" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="600" font-size="13" fill="#172227">Node&lt;K&gt;</text>
    <line x1="580" y1="794" x2="940" y2="794" stroke="#C7CEC8"/>
    <text x="595" y="810" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">- key: K</text>
    <text x="595" y="824" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">~ next: Node&lt;K&gt;</text>
    <text x="595" y="838" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">~ prev: Node&lt;K&gt;</text>
    <line x1="580" y1="850" x2="940" y2="850" stroke="#C7CEC8"/>
    <text x="595" y="866" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#172227">+ getKey(): K</text>
  </g>

  <!-- ============ UML note: two-map decision ============ -->
  <g>
    <path d="M60 580 H360 V734 L344 750 H60 Z" fill="#F5E4CF" stroke="#B8722A" stroke-width="1.2"/>
    <path d="M344 750 V734 H360 Z" fill="#FFFFFF" stroke="#B8722A" stroke-width="1.2"/>
    <text x="75" y="602" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#6B4319">Why two maps?</text>
    <text x="75" y="620" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#6B4319">Storage stores K&#8594;V. LRU needs</text>
    <text x="75" y="634" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#6B4319">K&#8594;Node for O(1) splicing. Keeping</text>
    <text x="75" y="648" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#6B4319">them separate keeps Storage generic</text>
    <text x="75" y="662" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#6B4319">and swappable &#8212; the trade-off is</text>
    <text x="75" y="676" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#6B4319">Cache.put() must update both,</text>
    <text x="75" y="690" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#6B4319">non-atomically. See #2 and #3.</text>

    <line x1="360" y1="610" x2="578" y2="420" stroke="#B8722A" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>

</svg>
