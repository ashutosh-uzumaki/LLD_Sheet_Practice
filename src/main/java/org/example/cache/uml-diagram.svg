<svg viewBox="0 0 920 700" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="UML class diagram of the cache: Cache depends on the Storage and EvictionPolicy interfaces; MapStorage implements Storage; LruEvictionPolicy implements EvictionPolicy and owns a DoublyLinkedList of Node, plus its own key-to-node map noted separately from Storage's map.">
  <defs>
    <marker id="arrowOpen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#55635F" stroke-width="1.4"/>
    </marker>
    <marker id="triHollow" viewBox="0 0 14 12" refX="12.5" refY="6" markerWidth="15" markerHeight="13" orient="auto-start-reverse">
      <path d="M1,1 L13,6 L1,11 Z" fill="#FFFFFF" stroke="#55635F" stroke-width="1.3"/>
    </marker>
    <marker id="diamondFilled" viewBox="0 0 14 9" refX="1" refY="4.5" markerWidth="14" markerHeight="9" orient="auto">
      <polygon points="1,4.5 7,1 13,4.5 7,8" fill="#55635F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="700" fill="#FFFFFF"/>

  <!-- ================= Cache ================= -->
  <g>
    <rect x="335" y="16" width="250" height="104" rx="6" fill="#FFFFFF" stroke="#172227" stroke-width="1.4"/>
    <text x="460" y="40" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="600" font-size="14" fill="#172227">Cache&lt;K,V&gt;</text>
    <line x1="335" y1="52" x2="585" y2="52" stroke="#C7CEC8"/>
    <text x="350" y="70" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#55635F">- storage: Storage&lt;K,V&gt;</text>
    <text x="350" y="86" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#55635F">- evictionPolicy: EvictionPolicy&lt;K&gt;</text>
    <text x="350" y="102" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#55635F">- maxCapacity: int</text>

    <circle cx="543" cy="12" r="10" fill="#F5E4CF" stroke="#B8722A"/>
    <text x="543" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="600" fill="#6B4319">1</text>
    <circle cx="563" cy="12" r="10" fill="#F5E4CF" stroke="#B8722A"/>
    <text x="563" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="600" fill="#6B4319">3</text>
    <circle cx="583" cy="12" r="10" fill="#F5E4CF" stroke="#B8722A"/>
    <text x="583" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="600" fill="#6B4319">7</text>
  </g>

  <!-- Cache -> Storage / EvictionPolicy (dependency) -->
  <line x1="420" y1="120" x2="220" y2="177" stroke="#55635F" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowOpen)"/>
  <text x="300" y="150" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">uses</text>

  <line x1="500" y1="120" x2="700" y2="177" stroke="#55635F" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowOpen)"/>
  <text x="600" y="150" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">uses</text>

  <!-- ============ Storage interface ============ -->
  <g>
    <rect x="90" y="180" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#1F6F78" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="210" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-style="italic" font-size="10.5" fill="#1F6F78">&#171;interface&#187;</text>
    <text x="210" y="217" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="600" font-size="13" fill="#172227">Storage&lt;K,V&gt;</text>
    <line x1="100" y1="227" x2="320" y2="227" stroke="#C7CEC8"/>
    <text x="105" y="242" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#55635F">+ add/get/remove/contains/size</text>
  </g>

  <!-- ============ EvictionPolicy interface ============ -->
  <g>
    <rect x="560" y="180" width="270" height="70" rx="6" fill="#FFFFFF" stroke="#1F6F78" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="695" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-style="italic" font-size="10.5" fill="#1F6F78">&#171;interface&#187;</text>
    <text x="695" y="217" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="600" font-size="13" fill="#172227">EvictionPolicy&lt;K&gt;</text>
    <line x1="570" y1="227" x2="820" y2="227" stroke="#C7CEC8"/>
    <text x="575" y="242" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#55635F">+ addNewNode/markAccessed/evict</text>

    <circle cx="824" cy="176" r="10" fill="#F5E4CF" stroke="#B8722A"/>
    <text x="824" y="180" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="600" fill="#6B4319">6</text>
  </g>

  <!-- realization: MapStorage -> Storage -->
  <line x1="210" y1="320" x2="210" y2="252" stroke="#55635F" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#triHollow)"/>
  <!-- realization: LruEvictionPolicy -> EvictionPolicy -->
  <line x1="695" y1="310" x2="695" y2="252" stroke="#55635F" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#triHollow)"/>

  <!-- ============ MapStorage ============ -->
  <g>
    <rect x="90" y="320" width="240" height="80" rx="6" fill="#FFFFFF" stroke="#172227" stroke-width="1.4"/>
    <text x="210" y="345" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="600" font-size="13" fill="#172227">MapStorage&lt;K,V&gt;</text>
    <line x1="100" y1="357" x2="320" y2="357" stroke="#C7CEC8"/>
    <text x="105" y="373" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">- storageMap: Map&lt;K,V&gt;</text>
    <text x="105" y="389" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#55635F">returns null on miss</text>

    <circle cx="324" cy="314" r="10" fill="#F5E4CF" stroke="#B8722A"/>
    <text x="324" y="318" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="600" fill="#6B4319">5</text>
  </g>

  <!-- ============ LruEvictionPolicy ============ -->
  <g>
    <rect x="560" y="310" width="270" height="100" rx="6" fill="#FFFFFF" stroke="#172227" stroke-width="1.6"/>
    <text x="695" y="335" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="600" font-size="13" fill="#172227">LruEvictionPolicy&lt;K&gt;</text>
    <line x1="570" y1="347" x2="820" y2="347" stroke="#C7CEC8"/>
    <text x="575" y="363" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">- nodeMap: Map&lt;K,Node&lt;K&gt;&gt;</text>
    <text x="575" y="379" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">- list: DoublyLinkedList&lt;K&gt;</text>
    <text x="575" y="395" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#55635F">own map, separate from Storage's &#8594;</text>

    <circle cx="824" cy="304" r="11" fill="#F5E4CF" stroke="#B8722A" stroke-width="1.4"/>
    <text x="824" y="308" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" fill="#6B4319">2</text>
  </g>

  <!-- composition: LruEvictionPolicy -> DoublyLinkedList -->
  <line x1="695" y1="410" x2="695" y2="458" stroke="#55635F" stroke-width="1.4" marker-start="url(#diamondFilled)"/>
  <text x="702" y="438" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#55635F">list</text>

  <!-- ============ DoublyLinkedList ============ -->
  <g>
    <rect x="560" y="460" width="270" height="70" rx="6" fill="#FFFFFF" stroke="#172227" stroke-width="1.4"/>
    <text x="695" y="484" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="600" font-size="13" fill="#172227">DoublyLinkedList&lt;K&gt;</text>
    <line x1="570" y1="496" x2="820" y2="496" stroke="#C7CEC8"/>
    <text x="575" y="512" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">- head, tail: Node&lt;K&gt;</text>

    <circle cx="824" cy="454" r="10" fill="#F5E4CF" stroke="#B8722A"/>
    <text x="824" y="458" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="600" fill="#6B4319">4</text>
  </g>

  <!-- composition: DoublyLinkedList -> Node -->
  <line x1="695" y1="530" x2="695" y2="598" stroke="#55635F" stroke-width="1.4" marker-start="url(#diamondFilled)"/>
  <text x="702" y="568" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#55635F">head/tail/next/prev</text>

  <!-- ============ Node ============ -->
  <g>
    <rect x="560" y="600" width="270" height="80" rx="6" fill="#FFFFFF" stroke="#172227" stroke-width="1.4"/>
    <text x="695" y="624" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="600" font-size="13" fill="#172227">Node&lt;K&gt;</text>
    <line x1="570" y1="636" x2="820" y2="636" stroke="#C7CEC8"/>
    <text x="575" y="652" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">- key: K</text>
    <text x="575" y="667" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#55635F">~ next, prev: Node&lt;K&gt;</text>
  </g>

  <!-- ============ UML note: two-map decision ============ -->
  <g>
    <path d="M90 470 H310 V584 L294 600 H90 Z" fill="#F5E4CF" stroke="#B8722A" stroke-width="1.2"/>
    <path d="M294 600 V584 H310 Z" fill="#FFFFFF" stroke="#B8722A" stroke-width="1.2"/>
    <text x="104" y="492" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#6B4319">Why two maps?</text>
    <text x="104" y="510" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#6B4319">Storage stores K&#8594;V. LRU needs</text>
    <text x="104" y="524" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#6B4319">K&#8594;Node for O(1) splicing. Keeping</text>
    <text x="104" y="538" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#6B4319">them separate keeps Storage generic</text>
    <text x="104" y="552" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#6B4319">and swappable &#8212; the trade-off is</text>
    <text x="104" y="566" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#6B4319">Cache.put() must update both,</text>
    <text x="104" y="580" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#6B4319">non-atomically. See #2 and #3.</text>

    <line x1="310" y1="500" x2="558" y2="365" stroke="#B8722A" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>

</svg>
